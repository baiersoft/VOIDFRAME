name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-and-upload-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx tauri build
      - name: Compute SHA256 checksum
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path "target/release/bundle/nsis" -Filter "*-setup.exe" | Select-Object -First 1
          if (-not $installer) { throw "No NSIS installer found under target/release/bundle/nsis" }
          $hash = Get-FileHash -Path $installer.FullName -Algorithm SHA256
          "$($hash.Hash.ToLower())  $($installer.Name)" | Out-File -FilePath "SHA256SUMS.txt" -Encoding ascii
          echo "INSTALLER_PATH=$($installer.FullName)" >> $env:GITHUB_ENV
      - name: Upload installer + checksum to the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.INSTALLER_PATH }}
            SHA256SUMS.txt
