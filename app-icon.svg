<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="voidBg" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#0a0a18"/>
      <stop offset="60%" stop-color="#030308"/>
      <stop offset="100%" stop-color="#010103"/>
    </radialGradient>

    <!-- Cyan Specular Flare Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>

    <!-- Violet Core Gradient -->
    <linearGradient id="violetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>

    <!-- Outer Border Glow -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Filter Glow -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="coreGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="28" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect x="32" y="32" width="960" height="960" rx="220" fill="url(#voidBg)" stroke="url(#borderGrad)" stroke-width="8"/>

  <!-- Subtle Matrix Grid -->
  <g opacity="0.12" stroke="#ffffff" stroke-width="2">
    <line x1="200" y1="32" x2="200" y2="992"/>
    <line x1="350" y1="32" x2="350" y2="992"/>
    <line x1="512" y1="32" x2="512" y2="992"/>
    <line x1="674" y1="32" x2="674" y2="992"/>
    <line x1="824" y1="32" x2="824" y2="992"/>

    <line x1="32" y1="200" x2="992" y2="200"/>
    <line x1="32" y1="350" x2="992" y2="350"/>
    <line x1="32" y1="512" x2="992" y2="512"/>
    <line x1="32" y1="674" x2="992" y2="674"/>
    <line x1="32" y1="824" x2="992" y2="824"/>
  </g>

  <!-- Ambient Violet Center Glow -->
  <circle cx="512" cy="512" r="240" fill="url(#violetGrad)" opacity="0.18" filter="url(#coreGlow)"/>

  <!-- Precision Chevron / Telemetry Frame Vector (Outer V) -->
  <path d="M 230 290 L 512 790 L 794 290 L 670 290 L 512 590 L 354 290 Z" 
        fill="url(#cyanGrad)" 
        filter="url(#neonGlow)"/>

  <!-- Inner Chevron Frame (Inverted/Nested V) -->
  <path d="M 330 330 L 512 660 L 694 330 L 620 330 L 512 530 L 404 330 Z" 
        fill="#04040a" 
        stroke="#22d3ee" 
        stroke-width="6" 
        opacity="0.85"/>

  <!-- Central Neural Singularity Diamond -->
  <polygon points="512,390 580,480 512,570 444,480" 
           fill="url(#violetGrad)" 
           filter="url(#coreGlow)"/>

  <polygon points="512,420 555,480 512,540 469,480" 
           fill="#ffffff" 
           opacity="0.9"/>

  <!-- Precision Telemetry Corner Dots -->
  <circle cx="230" cy="290" r="10" fill="#22d3ee" filter="url(#neonGlow)"/>
  <circle cx="794" cy="290" r="10" fill="#22d3ee" filter="url(#neonGlow)"/>
  <circle cx="512" cy="790" r="12" fill="#22d3ee" filter="url(#neonGlow)"/>

  <!-- Top Accent Shimmer Line -->
  <line x1="360" y1="180" x2="664" y2="180" stroke="#22d3ee" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
</svg>
