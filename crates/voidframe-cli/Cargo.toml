[package]
name = "voidframe-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "voidframe-cli"
path = "src/main.rs"

[dependencies]
voidframe-engine = { path = "../voidframe-engine" }
clap = { version = "4", features = ["derive"] }
rand.workspace = true
anyhow = "1"
tokio = { workspace = true }
tracing.workspace = true
tracing-subscriber = "0.3"
serde_json.workspace = true
uuid.workspace = true
# Real dependency, not dev-only: `dry-run` uses a scratch dir per scenario's
# journal at runtime (cmd_dry_run::run_collect), not just in tests.
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows.workspace = true
