[package]
name = "voidframe-engine"
version = "0.1.1"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "voidframe_engine"

[dependencies]
csv.workspace = true
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
async-trait.workspace = true
thiserror.workspace = true
tracing.workspace = true
uuid.workspace = true
dirs.workspace = true
rand.workspace = true
specta = { version = "2.0.0-rc.25", optional = true, features = ["derive", "serde_json"] }
specta-typescript = { version = "0.0.12", optional = true }
nalgebra = "0.35.0"

[features]
specta = ["dep:specta", "dep:specta-typescript"]

[target.'cfg(windows)'.dependencies]
windows.workspace = true

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["rt", "macros", "sync", "fs", "time", "io-util", "test-util"] }
